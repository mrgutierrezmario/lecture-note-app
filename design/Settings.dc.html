<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0B74F6; } a:hover { color: #0857B8; }
    * { box-sizing: border-box; }
    svg { display: block; }
  </style>
</helmet>
<div style="--bg:#0A1430; --surface:#101D3F; --surface-2:#172650; --border:#243663; --text:#E7ECF7; --muted:#9AAAC9; --faint:#6D7FA6; --primary:#0B74F6; --teal:#11D4B2; width: 760px; height: 720px; background: rgba(4,10,28,0.72); display: flex; align-items: flex-start; justify-content: center; padding: 40px 0; overflow: hidden;">

  <div style="width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); box-shadow: 0 24px 64px rgba(0,0,0,0.45); display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 60px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);">
      <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em;">Settings</div>
      <button style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 8px; color: var(--muted); cursor: pointer;" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <!-- Appearance: new section, first because it is the one every user touches -->
    <div style="padding: 20px 24px 24px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 600;">Appearance</div>
        <div style="font-size: 13px; color: var(--muted); line-height: 1.5;">Saved in this browser. System follows your operating system setting.</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
        <button style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
          System
        </button>
        <button style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          Light
        </button>
        <button style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(11,116,246,0.14); border: 1px solid var(--primary); box-shadow: 0 0 0 3px rgba(11,116,246,0.22); border-radius: 10px; color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          Dark
        </button>
      </div>
    </div>

    <!-- Existing sections, unchanged in content -->
    <div style="padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; font-weight: 600;">Claude credentials</div>
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;">
        <span style="width: 22px; height: 22px; border-radius: 50%; background: rgba(17,212,178,0.16); color: var(--teal); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 13px; font-weight: 600;">API key</div>
          <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted);">sk-ant-…4f2a</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="password" placeholder="Replace stored key…" style="flex-grow: 1; height: 36px; padding: 0 12px; font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; outline: none;">
        <button style="height: 36px; padding: 0 14px; background: var(--primary); color: #FFFFFF; border: none; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Save key</button>
        <button style="height: 36px; padding: 0 14px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Clear</button>
      </div>
    </div>

    <div style="padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; font-weight: 600;">Models</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted);">
          Image / slide analysis
          <select style="height: 36px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; outline: none;"><option>Claude Opus 5 — best at dense slides</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted);">
          Transcription (Whisper)
          <select style="height: 36px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; outline: none;"><option>small — keeps up with realtime on CPU</option></select>
        </label>
      </div>
    </div>

    <div style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; font-weight: 600;">Ollama</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--teal);"></span>
        Reachable · <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;">http://ollama:11434</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
