# AI Lecture Notes — self-contained production stack.
# Start with deploy/start.sh (builds, starts, pulls models, bootstraps the admin).
#
# Public URL: Tailscale Funnel on the `tailscale` service. The app shares its
# network namespace, so Funnel proxies to localhost:8000 and the app still
# reaches postgres/minio/ollama by name through that namespace.

name: lecture-notes

x-restart: &restart unless-stopped
# Container logs are capped (the app logs every audio chunk); Docker rotates
# them instead of letting them grow for months on the host's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: *restart
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lecture_notes
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lecture_notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: *restart
    logging: *logging
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: make sure the audio bucket exists.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/lecture-audio --ignore-existing"

  # Bundled Ollama (CPU only — Docker cannot use the Mac's GPU). Started only
  # when OLLAMA_BASE_URL is unset; point it at a native Ollama for GPU speed.
  ollama:
    image: ollama/ollama:latest
    restart: *restart
    profiles: [bundled-ollama]
    volumes:
      # A named volume by default. Set OLLAMA_MODELS to a host directory that
      # already holds models (e.g. another Ollama's ~/.ollama) to share them.
      - ${OLLAMA_MODELS:-ollama-data}:/root/.ollama
    # llama3 needs ~5 GB of RAM while generating; Ollama unloads it after 5 idle minutes.

  # Writes the Funnel serve config into a volume (a file bind-mount would not
  # work when compose is driven from inside another container).
  tailscale-config:
    image: busybox:stable
    volumes:
      - tailscale-config:/config
    command:
      - sh
      - -c
      - |
        cat > /config/serve.json <<'EOF'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8000"}}}},"AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true}}
        EOF

  tailscale:
    image: tailscale/tailscale:latest
    restart: *restart
    logging: *logging
    hostname: ${TS_HOSTNAME:-lecture-notes}
    depends_on:
      tailscale-config:
        condition: service_completed_successfully
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-lecture-notes}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-config:/config:ro
    # Probes the public URL end to end through Funnel (any HTTP status counts;
    # app health is the app's own check). Catches tailscaled's HTTPS listener
    # hanging while `tailscale status` still says online (2026-09-20). With
    # TS_USERSPACE the tailnet IP is not a local interface, so the public
    # name is the only probe that exercises tailscaled. The watchdog service
    # acts on it. start_period covers first login, Funnel and cert issuance.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          d=$$(tailscale status --json | sed -n 's/^ *"DNSName": "\([^"]*\)\.",\{0,1\}$$/\1/p' | head -1)
          && [ -n "$$d" ]
          && wget -qS -T 10 -O /dev/null "https://$$d/health" 2>&1 | grep -q '^ *HTTP/'
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m
    ports:
      # Local/LAN access to the app without going through Funnel.
      - "${APP_PORT:-8010}:8000"
    extra_hosts:
      # Lets the app (which shares this network namespace) reach services on
      # the Mac itself, e.g. a native Ollama at host.docker.internal:11434.
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lecture-notes-app:latest
    restart: *restart
    logging: *logging
    # A ceiling for the container, one core above WHISPER_THREADS so the web
    # app and websockets are not fighting the transcription threads for the
    # same quota. Leaves the rest of the Mac to macOS, Docker and everything
    # else. Raise both together if transcription ever falls behind.
    cpus: ${APP_CPUS:-5}
    network_mode: service:tailscale
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      tailscale:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lecture_notes
      POSTGRES_HOST: postgres
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: lecture-audio
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # How many threads Whisper may use. Without this, faster-whisper calls
      # WhisperModel(device="cpu") with no cpu_threads, so CTranslate2 sizes
      # its OpenMP pool from every core it can see — all of the Mac's — and a
      # lecture makes the whole machine unresponsive. `small` transcribes a
      # 5 s chunk in ~1.1 s using everything; at 4 threads it is nearer 2 s,
      # still comfortably ahead of the 5 s recording cadence.
      OMP_NUM_THREADS: ${WHISPER_THREADS:-4}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-14}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AI Lecture Notes}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    volumes:
      - app-state:/app/state
      # Whisper / Hugging Face model downloads.
      - app-cache:/root/.cache

  # Self-healing for the public URL: restarts tailscale + app when the
  # tailscale healthcheck fails (Docker alone only marks it unhealthy).
  watchdog:
    build: ./watchdog
    image: lecture-notes-watchdog:latest
    restart: *restart
    logging: *logging
    environment:
      PROJECT: lecture-notes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  minio-data:
  ollama-data:
  tailscale-state:
  tailscale-config:
  app-state:
  app-cache:
