# AI Lecture Notes — self-contained production stack.
# Start with deploy/start.sh (builds, starts, pulls models, bootstraps the admin).
#
# Public URL: Tailscale Funnel on the `tailscale` service. The app shares its
# network namespace, so Funnel proxies to localhost:8000 and the app still
# reaches postgres/garage/ollama by name through that namespace.

name: lecture-notes

x-restart: &restart unless-stopped
# Container logs are capped (the app logs every audio chunk); Docker rotates
# them instead of letting them grow for months on the host's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: *restart
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lecture_notes
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lecture_notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for the audio chunks. Replaces MinIO, which stopped
  # publishing community binaries and images in 2025. Single node, ~5 MB RAM.
  # garage-init.sh (run by start.sh/restore.sh) creates the layout, key, bucket.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: *restart
    logging: *logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in deploy/.env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in deploy/.env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Bundled Ollama (CPU only — Docker cannot use the Mac's GPU). Started only
  # when OLLAMA_BASE_URL is unset; point it at a native Ollama for GPU speed.
  ollama:
    image: ollama/ollama:latest
    restart: *restart
    profiles: [bundled-ollama]
    volumes:
      # A named volume by default. Set OLLAMA_MODELS to a host directory that
      # already holds models (e.g. another Ollama's ~/.ollama) to share them.
      - ${OLLAMA_MODELS:-ollama-data}:/root/.ollama
    # llama3 needs ~5 GB of RAM while generating; Ollama unloads it after 5 idle minutes.

  # Writes the Funnel serve config into a volume (a file bind-mount would not
  # work when compose is driven from inside another container).
  tailscale-config:
    image: busybox:stable
    volumes:
      - tailscale-config:/config
    command:
      - sh
      - -c
      - |
        cat > /config/serve.json <<'EOF'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8000"}}}},"AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true}}
        EOF

  tailscale:
    # Pinned: containerboot's start-up behaviour (TS_AUTH_ONCE, exit on a
    # failed login) is what the watchdog is built around. Bump deliberately.
    image: tailscale/tailscale:v1.102.3
    restart: *restart
    logging: *logging
    hostname: ${TS_HOSTNAME:-lecture-notes}
    depends_on:
      tailscale-config:
        condition: service_completed_successfully
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-lecture-notes}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-dns=false
      # Log in only when the saved state has no login. Without it containerboot
      # runs `tailscale up` on every start and exits when that cannot reach the
      # control server in time, so an internet outage became a restart loop
      # (89 restarts on 2026-10-05), each one stranding the app on a dead
      # network namespace.
      TS_AUTH_ONCE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-config:/config:ro
    # Probes the public URL end to end through Funnel (any HTTP status counts;
    # app health is the app's own check). Catches tailscaled's HTTPS listener
    # hanging while `tailscale status` still says online (2026-09-20). With
    # TS_USERSPACE the tailnet IP is not a local interface, so the public
    # name is the only probe that exercises tailscaled. The watchdog service
    # acts on it. start_period covers first login, Funnel and cert issuance.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          d=$$(tailscale status --json | sed -n 's/^ *"DNSName": "\([^"]*\)\.",\{0,1\}$$/\1/p' | head -1)
          && [ -n "$$d" ]
          && wget -qS -T 10 -O /dev/null "https://$$d/health" 2>&1 | grep -q '^ *HTTP/'
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m
    ports:
      # This Mac only. The public addresses go through Cloudflare and
      # Tailscale, which don't use this port; set APP_BIND=0.0.0.0 to open it
      # to the local network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8010}:8000"
    extra_hosts:
      # Lets the app (which shares this network namespace) reach services on
      # the Mac itself, e.g. a native Ollama at host.docker.internal:11434.
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lecture-notes-app:latest
    restart: *restart
    logging: *logging
    # A ceiling for the container, one core above WHISPER_THREADS so the web
    # app and websockets are not fighting the transcription threads for the
    # same quota. Leaves the rest of the Mac to macOS, Docker and everything
    # else. Raise both together if transcription ever falls behind.
    cpus: ${APP_CPUS:-5}
    network_mode: service:tailscale
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      tailscale:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lecture_notes
      POSTGRES_HOST: postgres
      S3_ENDPOINT_URL: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/.env}
      S3_BUCKET: lecture-audio
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # How many threads Whisper may use. Without this, faster-whisper calls
      # WhisperModel(device="cpu") with no cpu_threads, so CTranslate2 sizes
      # its OpenMP pool from every core it can see — all of the Mac's — and a
      # lecture makes the whole machine unresponsive. `small` transcribes a
      # 5 s chunk in ~1.1 s using everything; at 4 threads it is nearer 2 s,
      # still comfortably ahead of the 5 s recording cadence.
      OMP_NUM_THREADS: ${WHISPER_THREADS:-4}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-14}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AI Lecture Notes}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Full demo access for requests through the cloudflared service (see below).
      DEMO_FULL_ACCESS_VIA_TUNNEL: ${DEMO_FULL_ACCESS_VIA_TUNNEL:-false}
      DEMO_RETENTION_HOURS: ${DEMO_RETENTION_HOURS:-24}
      DEMO_MAX_RECORDING_MINUTES: ${DEMO_MAX_RECORDING_MINUTES:-40}
      DEMO_MAX_RECORDINGS: ${DEMO_MAX_RECORDINGS:-3}
    volumes:
      - app-state:/app/state
      # Whisper / Hugging Face model downloads.
      - app-cache:/root/.cache

  # Self-healing for the public URL: restarts tailscale when its healthcheck
  # fails (Docker alone only marks it unhealthy) unless the internet itself is
  # down; re-attaches the app and cloudflared whenever tailscale has restarted
  # underneath them; restarts the app after ~10 minutes unhealthy or an error
  # exit, and cloudflared when it exits or loses Cloudflare for ~5 minutes.
  # See watchdog/watchdog.sh.
  watchdog:
    build: ./watchdog
    image: lecture-notes-watchdog:latest
    restart: *restart
    logging: *logging
    environment:
      PROJECT: lecture-notes
      DEPENDANTS: app cloudflared
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional second public address through Cloudflare Tunnel. Off unless
  # COMPOSE_PROFILES=cloudflare, and CLOUDFLARED_CONFIG / CLOUDFLARED_CREDENTIALS
  # point at a tunnel config and its credentials file (both kept outside the
  # repo). It shares the tailscale container's network namespace like the app,
  # so the config's service is http://127.0.0.1:8000 — or http://tailscale:8000
  # with DEMO_FULL_ACCESS_VIA_TUNNEL=true: dialling the container's own address
  # instead of loopback is how the app tells tunnel requests from Funnel ones,
  # and there "Try the demo" may record, upload and edit.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [cloudflare]
    restart: *restart
    logging: *logging
    network_mode: service:tailscale
    # Fixed metrics address: the watchdog polls /ready on it to notice a
    # tunnel that is running but has no connection to Cloudflare.
    command: tunnel --metrics 127.0.0.1:20241 --config /etc/cloudflared/config.yml run
    depends_on:
      app:
        condition: service_started
    volumes:
      - ${CLOUDFLARED_CONFIG:-/dev/null}:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS:-/dev/null}:/etc/cloudflared/credentials.json:ro

volumes:
  postgres-data:
  # MinIO's data, kept as a rollback after the move to Garage (2026-09-25).
  # Nothing uses it; delete with `docker volume rm lecture-notes_minio-data`
  # once Garage has run a week without trouble.
  minio-data:
  garage-data:
  ollama-data:
  tailscale-state:
  tailscale-config:
  app-state:
  app-cache:
