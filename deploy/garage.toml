# Garage — S3-compatible object storage for the audio chunks (replaced MinIO
# on 2026-09-25: MinIO stopped publishing community binaries and images).
# Single node, one copy. Secrets come from the environment, not this file:
# GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN (see compose.yml / .env).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match the region the app signs requests with (S3_REGION, default us-east-1).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
